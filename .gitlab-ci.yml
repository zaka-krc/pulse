# ============================================================================
# Pulse — GitLab CI/CD Pipeline
# Stages: lint -> test -> build -> deploy (staging & production via Helm)
# ============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  HELM_CHART_PATH: "deploy/helm/pulse"

# ============================================================================
# STAGE 1 — LINT & VALIDATION (Backend, Frontend, Helm Chart)
# ============================================================================

lint:backend:
  stage: lint
  image: python:3.12-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - pip install --quiet ruff==0.11.8
  script:
    - ruff check .
    - ruff format --check .

lint:frontend:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck

lint:helm:
  stage: lint
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  script:
    - helm lint "$HELM_CHART_PATH"
    - helm lint "$HELM_CHART_PATH" -f "$HELM_CHART_PATH/values-staging.yaml"
    - helm lint "$HELM_CHART_PATH" -f "$HELM_CHART_PATH/values-production.yaml"
    - helm template pulse "$HELM_CHART_PATH" -f "$HELM_CHART_PATH/values-staging.yaml" > /dev/null
    - helm template pulse "$HELM_CHART_PATH" -f "$HELM_CHART_PATH/values-production.yaml" > /dev/null

# ============================================================================
# STAGE 2 — AUTOMATED TESTS (pytest + PostgreSQL service, Vitest + Coverage)
# ============================================================================

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: pulse_test
    POSTGRES_PASSWORD: pulse_test_password
    POSTGRES_DB: pulse_test
    PULSE_DATABASE_URL: "postgresql+psycopg://pulse_test:pulse_test_password@postgres:5432/pulse_test"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - pip install --quiet -r requirements-dev.txt
  script:
    - pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

test:frontend:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# ============================================================================
# STAGE 3 — CONTAINER IMAGE BUILD (Kaniko rootless -> GitLab Container Registry)
# ============================================================================

.kaniko_build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:backend:
  extends: .kaniko_build
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/backend"
      --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile"
      --destination "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$BACKEND_IMAGE:latest"
      --cache=true

build:frontend:
  extends: .kaniko_build
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/frontend"
      --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile"
      --destination "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$FRONTEND_IMAGE:latest"
      --cache=true

# ============================================================================
# STAGE 4 — KUBERNETES DEPLOYMENT VIA HELM
# ============================================================================

.helm_deploy:
  stage: deploy
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  before_script:
    - if [ -n "$KUBE_CONTEXT" ]; then helm --kube-context "$KUBE_CONTEXT" version; fi

deploy:staging:
  extends: .helm_deploy
  environment:
    name: staging
    url: https://pulse-staging.example.com
  script:
    - helm upgrade --install pulse "$HELM_CHART_PATH"
      --namespace pulse-staging
      --create-namespace
      --values "$HELM_CHART_PATH/values-staging.yaml"
      --set backend.image.repository="$BACKEND_IMAGE"
      --set backend.image.tag="$CI_COMMIT_SHORT_SHA"
      --set frontend.image.repository="$FRONTEND_IMAGE"
      --set frontend.image.tag="$CI_COMMIT_SHORT_SHA"
      --atomic
      --wait
      --timeout 5m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  extends: .helm_deploy
  environment:
    name: production
    url: https://pulse.example.com
  script:
    - helm upgrade --install pulse "$HELM_CHART_PATH"
      --namespace pulse-prod
      --create-namespace
      --values "$HELM_CHART_PATH/values-production.yaml"
      --set backend.image.repository="$BACKEND_IMAGE"
      --set backend.image.tag="$CI_COMMIT_SHORT_SHA"
      --set frontend.image.repository="$FRONTEND_IMAGE"
      --set frontend.image.tag="$CI_COMMIT_SHORT_SHA"
      --atomic
      --wait
      --timeout 5m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
