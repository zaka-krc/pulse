services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pulse-backend:local
    environment:
      PULSE_ENVIRONMENT: compose
      PULSE_DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/pulse
      PULSE_SEED_DEMO: "true"
      PULSE_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
