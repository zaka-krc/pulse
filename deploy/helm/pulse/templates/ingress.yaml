{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pulse.fullname" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API traffic goes straight to FastAPI...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "pulse.backendHost" . }}
                port:
                  name: http
          # ...everything else is the React SPA.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pulse.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
