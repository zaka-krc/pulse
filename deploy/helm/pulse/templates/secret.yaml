{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.url) }}
{{- fail "Set externalDatabase.url when postgresql.enabled=false" }}
{{- end }}
{{- $name := include "pulse.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pgPassword := include "pulse.secretValue" (dict "value" .Values.postgresql.auth.password "existing" $existing "key" "POSTGRES_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  PULSE_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $pgPassword (include "pulse.postgresHost" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  PULSE_DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
