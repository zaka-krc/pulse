apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-config
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  PULSE_ENVIRONMENT: {{ .Values.config.environment | quote }}
  PULSE_SEED_DEMO: {{ .Values.config.seedDemo | quote }}
  PULSE_CORS_ORIGINS: {{ .Values.config.corsOrigins | toJson | quote }}
