apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pulse.fullname" . }}-test-connection
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readiness
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "pulse.backendHost" . }}:8000/api/health/ready"]
    - name: tickets-api
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "pulse.fullname" . }}-frontend/api/tickets"]
